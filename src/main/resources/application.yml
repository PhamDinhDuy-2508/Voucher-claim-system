server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: voucher-claim-service
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/voucher_claim?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${MYSQL_USER:voucher}
    password: ${MYSQL_PASSWORD:voucher}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: true
    consumer:
      group-id: ${KAFKA_NOTIFICATION_GROUP:voucher-notification-service}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.example.voucherclaim.*
    listener:
      ack-mode: record
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  jpa:
    open-in-view: false
    hibernate:
      # Create missing tables and update the schema on application startup without deleting existing data.
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    properties:
      hibernate:
        jdbc:
          batch_size: 500
        order_inserts: true
        type:
          preferred_uuid_jdbc_type: CHAR
  jackson:
    default-property-inclusion: non_null
  lifecycle:
    timeout-per-shutdown-phase: 20s
  task:
    scheduling:
      pool:
        size: ${SCHEDULER_POOL_SIZE:2}
      thread-name-prefix: voucher-scheduler-
      shutdown:
        await-termination: true
        await-termination-period: 20s

logging:
  level:
    # DEBUG exposes per-request state transitions; keep INFO at high TPS to avoid log amplification.
    com.example.voucherclaim: ${VOUCHER_CLAIM_LOG_LEVEL:INFO}

app:
  scheduler:
    enabled: ${SCHEDULER_ENABLED:true}
  auth:
    internal-token: ${INTERNAL_TOKEN:local-internal-token}
  availability:
    cache-ttl: ${CAMPAIGN_AVAILABILITY_CACHE_TTL:1s}
  result-cache:
    ttl: 30s
  priority:
    collection-window: ${PRIORITY_COLLECTION_WINDOW:100ms} # Time to collect requests before dispatch.
    scheduler-scan-interval: ${PRIORITY_SCHEDULER_SCAN_INTERVAL:10} # Scheduler polling interval in milliseconds.
    max-pending-per-campaign: 10000 # Maximum Redis ZSET members retained for one campaign.
    admission-batch-size: 32 # Maximum requests popped per campaign dispatch cycle.
    min-worker-threads: 8 # Warm baseline of claim workers kept available for normal traffic.
    max-worker-threads: 32 # Hard cap on concurrent claim workers and MySQL claim transactions.
    queue-key-grace: 10m # Redis queue key TTL after its last enqueue.
  claim-request:
    lease-duration: ${CLAIM_REQUEST_LEASE_DURATION:5s}
    retry-delay: ${CLAIM_REQUEST_RETRY_DELAY:100ms}
    queue-recheck-delay: ${CLAIM_REQUEST_QUEUE_RECHECK_DELAY:5s}
    max-attempts: ${CLAIM_REQUEST_MAX_ATTEMPTS:10}
    recovery-batch-size: ${CLAIM_REQUEST_RECOVERY_BATCH_SIZE:500}
    recovery-interval: ${CLAIM_REQUEST_RECOVERY_INTERVAL:2000}
  activation:
    poll-interval: ${ACTIVATION_POLL_INTERVAL:100}
    lease-duration: ${ACTIVATION_LEASE_DURATION:30s}
    retry-delay: ${ACTIVATION_RETRY_DELAY:1s}
    slot-batch-size: ${ACTIVATION_SLOT_BATCH_SIZE:1000}
    recovery-batch-size: ${ACTIVATION_RECOVERY_BATCH_SIZE:10}
  expiration-cleanup:
    poll-interval: ${EXPIRATION_CLEANUP_POLL_INTERVAL:1000} # Scan interval in milliseconds.
    campaign-batch-size: ${EXPIRATION_CLEANUP_CAMPAIGN_BATCH_SIZE:20} # Campaigns processed per scheduler pass.
    slot-delete-batch-size: ${EXPIRATION_CLEANUP_SLOT_DELETE_BATCH_SIZE:5000} # Maximum slot rows deleted per transaction.
  user-score-seed:
    enabled: ${USER_SCORE_SEED_ENABLED:true}
    count: ${USER_SCORE_SEED_COUNT:500}
    start-id: ${USER_SCORE_SEED_START_ID:2000000000000001}
  outbox:
    poll-interval: ${OUTBOX_POLL_INTERVAL:500}
    batch-size: ${OUTBOX_BATCH_SIZE:100}
    max-retries: ${OUTBOX_MAX_RETRIES:10}
  kafka:
    notification-topic: ${KAFKA_NOTIFICATION_TOPIC:voucher.notifications}
    notification-topic-partitions: ${KAFKA_NOTIFICATION_TOPIC_PARTITIONS:6}
    send-timeout: ${KAFKA_SEND_TIMEOUT:3s}
